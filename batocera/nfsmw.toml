# nfsmw.toml - settings of NFSMW for Batocera (Retroid Pocket 5, Snapdragon 865 / Adreno 650, Mesa Turnip).
#
# Taken from NFSMW Android Evolved's settings (the tuned Switch release ones without the Switch-only keys).
# It lives next to the nfsmw executable in /userdata/roms/ports/nfsmw/. The Debug Menu (L + R + Right) can change
# most of them while playing and save them here.

# The code only turns these on for the Switch (REX_PLATFORM_SWITCH); a phone needs them just as much.
nfsmw_render_sin_mosaico = true      # draw the scene once: no 3-strip tiling, no MSAA
nfsmw_cubemap_caras_siempre = 4      # the rear-view mirror face of the car cubemap, every frame

# 1280x720 is what the Switch draws in handheld mode (30 FPS there). The Retroid Pocket 5 screen is 1920x1080:
# try "1920x1080" once 1280x720 runs well (it needs a restart).
nfsmw_resolucion_interna = "1280x720"

# Diagnostics off: they only write to the log.
present_perfil_pintado = false
nfsmw_streaming_diag = false

# Language of the game's text: -1 = the edition's (Spanish on the PAL Spanish executable); 0 English, 1 French,
# 2 German, 3 Italian, 4 Spanish, 5 Dutch, 6 Swedish, 7 Danish, 12 Polish, 13 Finnish. Speech and movies stay in
# the disc's language. With the French dub of nfsmw-nx (tools/french-dub), ENGLISH.BIN holds the French text: 0.
nfsmw_idioma = -1

# ---- Linux (Batocera) gets the Android defaults ----
# The SDK picks these by platform, and its Linux defaults are the desktop ones: with them the music, the police radio
# and the menu sounds come out robotic (codepdbh/nfsmw-android PR #3538 saw it on a Linux PC). Android's values:
audio_xma_en_trabajador = 2          # XMA decoded by the worker thread
audio_sdl_bomba = true               # SDL audio fed by its own pump at a steady rate
audio_sdl_bomba_cola = 12
audio_maxqframes = 12
nfsmw_audio_esperar_servidor_ms = 30 # wait up to 30 ms for the game's audio server packet, as on Android/Switch
# Movies' audio: false = the game decodes it and plays it through its normal output (default on Batocera: the
# port's own decoder opens a second SDL stream, which came out broken on the Retroid Pocket 5); true = the port's.
nfsmw_video_audio_nativo = false
# Face buttons by letter: the Retroid Pocket 5 is labelled Nintendo-style (A on the right, B at the bottom), so the
# button with the letter the game shows is the one that acts (B = nitrous). false = by position, as on an Xbox pad.
input_sdl_por_letra = true
# The Retroid Pocket 5 sends Linux's BTN_X (= BTN_NORTH) for its top button: SDL, following the xpad driver,
# takes it for the left one. This puts left and top back where they are.
input_sdl_intercambiar_xy = true
# The native renderer does not use Xenos memory export, which needs vertex stores and atomics.
vulkan_require_vertex_pipeline_stores_and_atomics = false

