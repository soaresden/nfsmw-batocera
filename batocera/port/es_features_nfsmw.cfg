<?xml version="1.0" encoding="UTF-8"?>
<!--
  NFS Most Wanted (Xbox 360 recompiled) for Batocera: options in the game's ADVANCED GAME OPTIONS, submenu
  "NFS MOST WANTED". EmulationStation merges this file (it reads every es_features_*.cfg in
  /userdata/system/configs/emulationstation/) into the "sh" emulator of the Ports system, so the submenu also shows
  for the other ports: the other ports ignore it. "NFS Most Wanted.sh" copies it there and reads the values from
  batocera.conf (ports["NFS Most Wanted.sh"].nfsmw_*). Leaving an option on its default keeps nfsmw.toml's value.
-->
<features>
  <emulator name="sh">
    <features>
      <feature name="LANGUE DU JEU" value="nfsmw_language" submenu="NFS MOST WANTED" order="1"
               description="Langue des textes. Auto : celle de Batocera (avec le doublage francais de nfsmw-nx, la VF complete). Les voix et les videos suivent le disque.">
        <choice name="Auto (langue de Batocera)" value="auto"/>
        <choice name="Celle de l'edition (disque)" value="-1"/>
        <choice name="Anglais (ou VF doublee nfsmw-nx)" value="0"/>
        <choice name="Francais" value="1"/>
        <choice name="Allemand" value="2"/>
        <choice name="Italien" value="3"/>
        <choice name="Espagnol" value="4"/>
        <choice name="Neerlandais" value="5"/>
        <choice name="Suedois" value="6"/>
        <choice name="Danois" value="7"/>
        <choice name="Polonais" value="12"/>
        <choice name="Finnois" value="13"/>
      </feature>
      <feature name="RESOLUTION INTERNE" value="nfsmw_resolution" submenu="NFS MOST WANTED" order="2"
               description="1280x720 : celle de la Xbox 360. 1920x1080 : l'ecran de la Retroid Pocket 5, plus fin et plus lourd.">
        <choice name="1280x720 (Xbox 360)" value="1280x720"/>
        <choice name="1920x1080" value="1920x1080"/>
        <choice name="1024x576" value="1024x576"/>
      </feature>
      <feature name="LIMITE DE FPS" value="nfsmw_fps" submenu="NFS MOST WANTED" order="3"
               description="60 : le maximum du jeu. 30 : stable, moins de chauffe et de batterie.">
        <choice name="60" value="60"/>
        <choice name="30" value="30"/>
      </feature>
      <feature name="FILTRE JAUNE DU JEU" value="nfsmw_visual_treatment" submenu="NFS MOST WANTED" order="4"
               description="La teinte jaune de la ville (visual treatment) : comme sur Xbox 360, a moitie, ou sans.">
        <choice name="Original" value="original"/>
        <choice name="Doux" value="suave"/>
        <choice name="Desactive" value="apagado"/>
      </feature>
      <feature name="ANTICRENELAGE" value="nfsmw_antialiasing" submenu="NFS MOST WANTED" order="5"
               description="FXAA lisse les bords pour un petit cout GPU.">
        <choice name="Desactive" value="apagado"/>
        <choice name="FXAA" value="fxaa"/>
      </feature>
      <feature name="FILTRE D'IMAGE" value="nfsmw_postprocess" submenu="NFS MOST WANTED" order="6"
               description="Filtres de couleur de l'image finale.">
        <choice name="Aucun" value="apagado"/>
        <choice name="Cinema" value="cine"/>
        <choice name="Sepia" value="sepia"/>
        <choice name="Noir et blanc" value="noir"/>
        <choice name="Froid" value="frio"/>
        <choice name="Chaud" value="calido"/>
        <choice name="Vif" value="vivo"/>
        <choice name="Matrix" value="matrix"/>
        <choice name="CRT" value="crt"/>
      </feature>
      <feature name="CORRESPONDANCE MANETTE" value="nfsmw_pad" submenu="NFS MOST WANTED" order="7"
               description="Auto : le jeu reconnait la manette lui-meme (conseille). Batocera : la configuration des manettes de Batocera.">
        <choice name="Auto (SDL du jeu)" value="auto"/>
        <choice name="Celle de Batocera" value="batocera"/>
      </feature>
      <feature name="BOUTONS A/B X/Y" value="nfsmw_buttons" submenu="NFS MOST WANTED" order="8"
               description="Par lettre : le bouton marque A valide. Par position : le bouton du bas valide, comme sur une manette Xbox.">
        <choice name="Par lettre" value="lettre"/>
        <choice name="Par position (Xbox)" value="position"/>
      </feature>
    </features>
  </emulator>
</features>
