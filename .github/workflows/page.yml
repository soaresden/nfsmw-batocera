# Publishes the installation page (page/) on GitHub Pages. One-time setting: Settings -> Pages -> Source:
# "GitHub Actions".
name: Page d'installation
on:
  push:
    branches: [main]
    paths: ['page/**', 'batocera/shader-builder/**', 'batocera/tools/ps_buttons/**', '.github/workflows/page.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: bash page/build_site.sh _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
